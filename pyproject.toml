openpyxl = "^3.1.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
starry-628-shop = "starry-628-shop.main:main"
filling_fake_data = "starry-628-shop.filling_fake_data:main"
filling_category_excel = "starry-628-shop.filling_db_excel:category_main"
filling_product_excel = "starry-628-shop.filling_db_excel:product_main"