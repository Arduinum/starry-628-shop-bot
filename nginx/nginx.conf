worker_processes auto;

events {
    worker_connections 1024;
}

http {
    log_format json '{ "time_local": "$time_local", "remote_addr": "$remote_addr", "request": "$request", "status": "$status", "body_bytes_sent": "$body_bytes_sent", "request_time": "$request_time", "upstream_response_time": "$upstream_response_time", "remote_user": "$remote_user", "http_referer": "$http_referer", "http_user_agent": "$http_user_agent" }';

    access_log /var/log/nginx/access.log json;
    error_log /var/log/nginx/error.log warn;

    upstream minio_gui {
        server minio:9001;
    }

    upstream minio_api {
        server minio:9000;
    }

    server {
        listen 85;
        server_name robot-minio-dev.arduinum628.ru;

        # перенаправление http запросов на https
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl;

        server_name robot-minio-dev.arduinum628.ru;

        ssl_certificate /app/ssl_keys/fullchain.pem; 
        ssl_certificate_key /app/ssl_keys/privkey.pem;

        # Redirect the browser to our port 3443 config
        return 301 $scheme://$server_name:3443$request_uri;
    }

    server {
        listen 3443 ssl;
        server_name robot-minio-dev.arduinum628.ru;

        ssl_certificate /app/ssl_keys/fullchain.pem; 
        ssl_certificate_key /app/ssl_keys/privkey.pem;

        # шифры для секретности соединения
        ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:AES128-GCM-SHA256:AES256-GCM-SHA384';

        location / {
            proxy_pass http://minio_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /minio/ui/ {
            rewrite ^/minio/ui/(.*) /$1 break;
            proxy_pass http://minio_gui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Поддержка webSocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}